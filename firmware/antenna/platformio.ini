; Unità antenna: ESP32 DevKit 30 pin (WROOM-32) nella scatola all'antenna.
; Ambienti: tx (NEMA11 + TMC2209, predefinito) e rx (SERVO42D in STEP/DIR/EN).

[platformio]
default_envs = tx
lib_dir = ../lib

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    gin66/FastAccelStepper@2.0.1

[env:tx]
build_flags = -DVERSIONE_TX=1
lib_deps =
    ${env.lib_deps}
    teemuatlut/TMCStepper@0.7.3

[env:rx]
build_flags = -DVERSIONE_TX=0
