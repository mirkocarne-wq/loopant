; Unità antenna: ESP32 DevKit 30 pin (WROOM-32) nella scatola all'antenna. Firmware unico per TX e RX:
; il tipo si sceglie dal pannello e resta in NVS.
; Dal 21/11/2026 si compila con arduino-cli e il core 3.1.1 (compila.sh): questo file non è più provato.

[platformio]
default_envs = antenna
lib_dir = ../lib

[env:antenna]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    gin66/FastAccelStepper@2.0.1
    olikraus/U8g2@^2.36
    teemuatlut/TMCStepper@0.7.3
